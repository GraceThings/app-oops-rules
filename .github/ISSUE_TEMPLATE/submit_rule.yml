name: Submit Community Rule
description: Contribute an App Oops permission configuration for a specific Android package.
title: "[Rule] "
labels: ["rule-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing to **App Oops Community Rules**!
        If you opened this page from App Oops, the fields below are pre-filled automatically.

  - type: input
    id: package_name
    attributes:
      label: Package Name
      description: Android package name (e.g. com.taobao.taobao)
      placeholder: com.example.app
    validations:
      required: true

  - type: textarea
    id: rule_json
    attributes:
      label: Rule JSON
      description: Standard JSON rule generated by App Oops (do not modify whitelist op names)
      render: json
    validations:
      required: true
